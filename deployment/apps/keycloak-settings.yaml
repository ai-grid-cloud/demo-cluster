# Settings for the template's Keycloak, on the hub, where the dedicated-hub
# profile's keycloak app runs it (namespace maas-db). For Keycloak on a
# cluster labelled ai-grid/external-services=true, deliver the ConfigMap to that
# cluster instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-settings
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@deploymentRepoURL@'
    targetRevision: '@deploymentRevision@'
    path: '@deploymentPath@/keycloak-settings'
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
