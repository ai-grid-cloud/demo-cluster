# Peers dial this directly, so the SNI stays <site>.grid.internal and matches the leaf.
fullnameOverride: grid-provider-gateway
# A standalone release does not inherit the umbrella's pin. Keep this Grid
# v0.3.0-rc.1 digest aligned with the template's apps/rhoai/values.yaml.
image:
  flavor: grid-gateway
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9
  digest: sha256:17b43cd1aeeb879c20c069774391eecd09f48d8920b2262000726ff401a7f54b
grid:
  networkName: grid
praxisConfig:
  source: render
  render:
    role: provider
    peerTrust:
      mode: spiffe
      spiffeIds:
        - spiffe://grid.internal/site/site-a
    # The one backend is the models Gateway (template apps/rhoai/grid-models),
    # which routes each call by X-Gateway-Model-Name to the model's
    # InferencePool through the HTTPRoute the provider console writes with the
    # model. So every model the console places on site-b is served here.
    backends:
      - cluster: local-model
        endpoints:
          - ai-grid-models-openshift-ai-inference.openshift-ingress.svc.cluster.local.:80
        transport:
          mode: plaintext
        # praxis refuses a name that resolves to a private address.
        trustPrivate: true
        # Plaintext to a cluster-local Service this deployment owns: the
        # Gateway has no TLS listener, and the call never leaves the cluster.
        allowPlaintextTrust: true
        # The Gateway answers /health with 404, so probe the port.
        healthCheck:
          type: tcp
gridIdentity:
  tlsSecretName: grid-site-identity
  caSecretName: grid-ca
  mountPath: /etc/praxis/tls
# Peers arrive through the router, so the Service needs no address of its own.
service:
  type: ClusterIP
# The router already carries 443 on both clusters, so peers arrive there. The
# Route's host is the name on this site's leaf, which is also the SNI a peer
# sends, so passthrough reaches the listener with the client certificate intact.
route:
  enabled: true
  host: site-b.grid.internal
  tls:
    termination: passthrough
  annotations:
    haproxy.router.openshift.io/timeout: 300s
networkPolicy:
  # A peer arrives through the load balancer, and externalTrafficPolicy Cluster
  # translates it to the address of the node that received it. The peer itself is
  # authenticated by its certificate and SPIFFE id on the listener, not here.
  from:
    - podSelector:
        matchLabels:
          grid.opendatahub.io/gateway-client: "true"
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    - ipBlock:
        cidr: 10.0.0.0/16
