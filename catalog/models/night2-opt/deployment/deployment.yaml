apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/api: completions
    ai-grid/clusters: site-b
    ai-grid/model-name: facebook/opt-125m
    ai-grid/version: "2"
    openshift.io/display-name: OPT 125m (night2, completions)
  labels:
    ai-grid/model: night2-opt
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: night2-opt
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    name: night2-opt
    uri: hf://facebook/opt-125m
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
    - image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:578e9946e60a14596185937f6a083c1d42f3cff343b18648090b9ac80691d2e0
      name: main
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: night2-opt
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: night2-opt-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: night2-opt
  policyTypes:
  - Ingress
