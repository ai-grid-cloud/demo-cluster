apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-b
    ai-grid/version: "1"
    openshift.io/description: hf://ibm-granite/granite-3.3-2b-instruct
    openshift.io/display-name: granite-3.3-2b-instruct
  labels:
    ai-grid/model: granite-33-2b-instruct
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: granite-33-2b-instruct
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    name: granite-33-2b-instruct
    uri: hf://ibm-granite/granite-3.3-2b-instruct
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler:
      template:
        containers:
        - args:
          - --metrics-cert-dir=/var/run/kserve/tls
          name: main
  template:
    containers:
    - env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --max-model-len 32768
      image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:578e9946e60a14596185937f6a083c1d42f3cff343b18648090b9ac80691d2e0
      name: main
      resources:
        requests:
          cpu: "4"
          memory: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: granite-33-2b-instruct
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: granite-33-2b-instruct-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: granite-33-2b-instruct
  policyTypes:
  - Ingress
