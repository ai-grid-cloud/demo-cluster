# From ai-grid-cloud/ai-grid-env-setup spokes/gpu/crs (Apache-2.0).
# Labels the GPU node (feature.node.kubernetes.io/pci-10de.present) so the GPU operator schedules
# onto it. The chart's operator-only install leaves this CR to us. The worker DaemonSet has to run on
# the nvidia.com/gpu NoSchedule node: the NFD operator's worker tolerates it by default (verified on a
# g6.xlarge, 2026-10-21: NFD labelled the tainted node).
apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata: {name: nfd-instance, namespace: openshift-nfd, annotations: {argocd.argoproj.io/sync-wave: "1"}}
spec:
  operand: {servicePort: 12000}
  workerConfig:
    configData: |
      core:
        sleepInterval: 60s
      sources:
        pci:
          deviceClassWhitelist: ["0200", "03", "12"]
          deviceLabelFields: [vendor]
