apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: maas-consumer-auth-proxy
    app.kubernetes.io/part-of: maas-consumer-deploy
  name: maas-consumer-auth-proxy
  namespace: openshift-ingress
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: maas-consumer-auth-proxy
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: maas-consumer-auth-proxy
    spec:
      containers:
        - args:
            - --http-address=0.0.0.0:4180
            - --metrics-address=0.0.0.0:9000
            - --reverse-proxy=true
            - --email-domain=*
            - --upstream=static://200
            - --skip-provider-button
            - --pass-access-token=true
            - --set-xauthrequest=true
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak-maas-db.apps.ocp.hf299.sandbox3324.opentlc.com/realms/saas
            - --scope=openid email profile
            - --oidc-email-claim=email
            - --oidc-groups-claim=groups
            - --use-system-trust-store=true
            - --provider-ca-file=/etc/oauth2_proxy/oidc-ca/oidc-ca.crt
            - --ssl-insecure-skip-verify=false
            - --redirect-url=https://maas.apps.ocp.bclkw.sandbox2619.opentlc.com/oauth2/callback
            - --cookie-domain=maas.apps.ocp.bclkw.sandbox2619.opentlc.com
            - --cookie-name=_maas_consumer_proxy
            - --cookie-expire=24h0m0s
            - --cookie-refresh=4m0s
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: OAUTH2_PROXY_CLIENT_ID
                  name: maas-consumer-auth-proxy-creds
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: OAUTH2_PROXY_CLIENT_SECRET
                  name: maas-consumer-auth-proxy-creds
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  key: OAUTH2_PROXY_COOKIE_SECRET
                  name: maas-consumer-auth-proxy-creds
          image: registry.redhat.io/rhoai/odh-kube-auth-proxy-rhel9@sha256:4d95f0387736fcff8e78aa1ab5545cc5687f5074e3047c4d6d4875fc18d8589d
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: oauth-proxy
          ports:
            - containerPort: 4180
              name: http
              protocol: TCP
            - containerPort: 9000
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/oauth2_proxy/oidc-ca
              name: oidc-ca
              readOnly: true
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: maas-consumer-auth-proxy
      serviceAccountName: maas-consumer-auth-proxy
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key: oidc-ca.crt
                path: oidc-ca.crt
            name: maas-consumer-oidc-ca
          name: oidc-ca
        - emptyDir:
            medium: Memory
            sizeLimit: 10Mi
          name: tmp
