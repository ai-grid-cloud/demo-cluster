apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    ai-grid/model: modelcar-granite-4-0-h-tiny-fp8-dynamic
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: modelcar-granite-4-0-h-tiny-fp8-dynamic-grid
  namespace: ai-grid-internal-models
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai-grid-models
    namespace: openshift-ingress
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: modelcar-granite-4-0-h-tiny-fp8-dynamic-inference-pool
      port: 8000
    matches:
    - headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: modelcar-granite-4-0-h-tiny-fp8-dynamic
      path:
        type: PathPrefix
        value: /v1/
    timeouts:
      backendRequest: 0s
      request: 0s
---
apiVersion: grid.praxis.fast/v1alpha1
kind: InferenceProvider
metadata:
  labels:
    ai-grid/model: modelcar-granite-4-0-h-tiny-fp8-dynamic
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: grid-modelcar-granite-4-0-h-tiny-fp8-dynamic-local
spec:
  backendKind: local_model
  clusterName: local-models
  endpoint: https://local-models.grid.internal/v1
  gridNetworkRef: grid
  models:
  - capabilities:
    - text_generation
    name: modelcar-granite-4-0-h-tiny-fp8-dynamic
  providerKind: vllm
