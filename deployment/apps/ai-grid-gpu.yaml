# NFD and the NVIDIA GPU operator on the inference spokes (site-b's GPU node,
# for granite-4-tiny).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-grid-gpu
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/ai-grid-gpu/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
