apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-b
    ai-grid/version: '2'
    openshift.io/display-name: Granite 4 Tiny
  labels:
    ai-grid/model: granite-4-tiny
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: granite-4-tiny
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: ai-grid-gpu
  model:
    name: granite-4-tiny
    uri: oci://registry.redhat.io/rhai/modelcar-granite-4-0-h-tiny-fp8-dynamic:3.0
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
    - name: main
      resources:
        limits:
          cpu: '3'
          memory: 12Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '2'
          memory: 8Gi
          nvidia.com/gpu: '1'
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
    - name: pvc-evictor
      volumeMounts:
      - name: kv-cache
        mountPath: /kv-cache
      - name: kv-cache
        mountPath: /kv-cache/kv/model-cache/models
        subPath: models
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    volumes:
    - name: kv-cache
      emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: granite-4-tiny
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: granite-4-tiny-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: granite-4-tiny
  policyTypes:
  - Ingress
