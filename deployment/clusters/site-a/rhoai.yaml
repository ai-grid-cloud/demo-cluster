# site-a (ingress): MaaS's public hostname. maas-api refuses to work until the
# MaaS gateway's listeners name an external hostname ("Gateway has no external
# hostname configured"), and the template leaves it unset. Helm replaces
# lists, so both of the template's listeners are repeated with the hostname
# added. The https listener also names the host's Let's Encrypt certificate
# (sites/site-a/maas-route/certificate.yaml); repeating the listener drops the
# profile's tls block, so without this the listener has no certificate. The
# Route passes TLS through to it, so the AI gateway controller's consumer
# portal (which attaches to the https listener only) serves /maas-portal.
# The live Gateway on site-a got this tls block by hand (oc patch, 2026-11-05):
# cluster-gitops' rhoai ApplicationSet ignores the listener hostnames with
# RespectIgnoreDifferences, so Argo CD never changes listeners after creation.
# A fresh install creates the Gateway with it.
components:
  aigateway:
    modelsAsAService:
      gateway:
        spec:
          listeners:
            - name: http
              port: 80
              hostname: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
            - name: https
              port: 443
              hostname: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - group: ""
                    kind: Secret
                    name: maas-gw-public-tls
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
# SSO Run 4 (ai-grid-research, 2026-11-04): maas-api (plus our org_id group fix, X11) and
# maas-controller from MaaS main 0ed0143 (#1816) + PR 1812 0818e91; the MaaS BFF
# from odh-dashboard main 76982ad (#10541) + PR 10540 ba7d88c, on
# the nightly's frontend images. Built in site-a's own registry
# (namespace sso-test-images). This list replaces the template's env list, so
# its other entries are repeated from apps/rhoai/values.yaml (cluster-gitops main
# after #203: only the AI gateway controller; the Grid operator and model
# controller come from the payload). The 1812 maas-api
# replaces Kevin Howell's loki-access-proxy test build. Remove after the test.
# core-bff is the payload's (2026-11-05): after odh-dashboard #10541 the portal
# frontend calls no core-bff /api route, so the stock user_token core-bff works.
operator:
  rhoai:
    olm:
      config:
        env:
          - name: RELATED_IMAGE_ODH_AI_GATEWAY_CONTROLLER_IMAGE
            value: quay.io/sbatsche/odh-ai-gateway-controller@sha256:3968ba3bf7037ae2eba0c6b9239c4b72ba50ef193fed987caf89649e49467015
          - name: RELATED_IMAGE_ODH_MAAS_API_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/maas-api@sha256:9e3744b72a8329732604c275c811d821b8eb1a5836b6dba3f7c6c118ffa81861
          - name: RELATED_IMAGE_ODH_MAAS_CONTROLLER_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/maas-controller@sha256:8527f2ad5e9efa01fda4ddbf35bdb2e39b70dac74bc12547c7a7c833e0575126
          - name: RELATED_IMAGE_ODH_MOD_ARCH_MAAS_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/maas-ui@sha256:fdf10f0ce2cd7b85e9a232e3c33d5d43ec36c9735b10848481d415f672a802e7
# Staged test of cluster-gitops fix/grid-gateway-networkpolicy (646e327): turn
# the grid gateways' ingress NetworkPolicies back on (site-a is combined, so
# both). Since #195 the rhoai ApplicationSet sets networkPolicy.from but not
# enabled, and the chart defaults it to false. Remove once cloud-provider
# carries the fix.
praxis-gateway:
  networkPolicy:
    enabled: true
praxis-provider-gateway:
  networkPolicy:
    enabled: true
