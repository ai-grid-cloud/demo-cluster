apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
    openshift.io/display-name: e2e-sub
  name: e2e-sub
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-cpu
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 10000
      window: 1h
  - name: e2e-gpu
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 10000
      window: 1h
  organization:
    id: e3f985ba-0624-4772-98ab-4d02bffaccf0
  owner:
    groups:
    - name: e3f985ba-0624-4772-98ab-4d02bffaccf0/ai-grid-users
    users: []
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  annotations:
    openshift.io/display-name: e2e-sub
  labels:
    ai-grid/subscription: e2e-sub
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: e2e-sub-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-cpu
    namespace: models-as-a-service
  - name: e2e-gpu
    namespace: models-as-a-service
  subjects:
    groups:
    - name: e3f985ba-0624-4772-98ab-4d02bffaccf0/ai-grid-users
    users: []
