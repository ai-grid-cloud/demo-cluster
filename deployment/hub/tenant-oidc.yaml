# The tenants' OIDC client, which the template's tenant Policy writes into
# site-a's AITenant. maas-cli is the public client the CLI and the portal's
# sign-in proxy share (MaaS matches the token's azp against it). No issuerUrl:
# the issuer is this deployment's Keycloak, its Route's host plus
# /realms/ai-grid.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhoai-tenant-oidc
  namespace: redhat-ai-grid
data:
  realm: ai-grid
  clientId: maas-cli
  audience: maas-cli
