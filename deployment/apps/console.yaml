apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The cloud provider's admin console on a dedicated hub, from its own Helm
  # chart: one pod with kube-auth-proxy (OpenShift sign-in), the console and
  # its backend. It saves models and subscriptions as commits to the catalog
  # repository that apps/catalog.yaml delivers. Before the first sync
  # completes, run the template's apps/console/create-secrets.sh
  # (apps/console/README.md). The default profile runs its own console app,
  # so list this one only on a dedicated hub.
  name: console
  namespace: openshift-gitops
spec:
  project: default
  sources:
    # UAT (serving options, trimmed scope): the chart from console 96cd66ae,
    # copied into uat/console-chart. Restore after the UAT.
    - repoURL: '@deploymentRepoURL@'
      targetRevision: '@deploymentRevision@'
      path: uat/console-chart
      helm:
        releaseName: ai-grid-provider-console
        valuesObject:
          # By digest: tags can be overwritten. Console and chart are main 6bff09e,
          # backend main e2570b4 (2026-11-03 fresh install).
          images:
            console:
              repository: image-registry.openshift-image-registry.svc:5000/ai-grid-provider-console/ai-grid-provider-console-uat
              tag: 96cd66ae
              digest: sha256:5c89f74532387cc318a4e39c6b17efb4d314e9da6b966cfe4564938c95700583
            backend:
              repository: image-registry.openshift-image-registry.svc:5000/ai-grid-provider-console/ai-grid-provider-backend-uat
              tag: 86093ec
              digest: sha256:da63bf465aa7c4e45948dbfec664ae030ebff27b6b9baf5e0f95842d047a7ad0
            authProxy:
              tag: ""
              digest: sha256:1a5f6e220362aa2077026bb7e3091c38f80aac861fa060b08045e58e783d5bc5
          console:
            # The Monitoring page: its tabs are the dashboard-* PersesDashboards in
            # one project, here OpenShift AI's, served by the Cluster Observability
            # Operator's Perses on the hub.
            perses:
              url: https://perses.openshift-cluster-observability-operator.svc:8080
              project: redhat-ods-monitoring
          backend:
            # Add to AI Grid and Remove patch ManagedCluster labels. The chart's
            # ValidatingAdmissionPolicy limits the backend to the ai-grid/* and
            # location labels and the ai-grid/* annotations.
            clusterWrites: true
            # The catalog repository. The token that pushes to it is Secret
            # ai-grid-backend-git, never in git; keep it scoped to this
            # repository alone.
            git:
              url: https://github.com/ai-grid-cloud/demo-cluster.git
              branch: main
              # Where the backend writes models. The catalog's delivery, its
              # AppProject and its status Policy all assume this namespace,
              # which rhoai-prerequisites' Policy creates.
              modelsNamespace: ai-grid-internal-models
    # What the chart doesn't hold: ACM Search access for the backend.
    - repoURL: '@templateRepoURL@'
      targetRevision: '@templateRevision@'
      path: apps/console/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-grid-provider-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
