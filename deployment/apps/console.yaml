apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The provider console on demo1, from its own Helm chart:
  # one pod with kube-auth-proxy (OpenShift sign-in), the console and its
  # backend. It saves models and subscriptions as commits to the catalog
  # repository that <deployment>/apps/acm-models.yaml delivers. Before the
  # first sync, run apps/console/create-secrets.sh (apps/console/README.md).
  name: console
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/ai-grid-cloud/ai-grid-provider-console.git
      # A commit, not a branch: the chart holds ClusterRoleBindings and a
      # ValidatingAdmissionPolicy that Argo CD applies with cluster-admin
      # rights, so what runs here changes only by a reviewed commit. Bump it
      # with the images.
      targetRevision: 49ba2ac3cad3af5ac65797840a0df5a55570bd38
      path: charts/ai-grid-provider-console
      helm:
        releaseName: ai-grid-provider-console
        valuesObject:
          # By digest: tags can be overwritten. Chart is main 49ba2ac; the
          # console image is draft PR 88 (Model API select) until it merges. Backend: a carry
          # build of cfchase:carry/grid-routing-objects at 83b2cdd (grid routing per model),
          # pushed to this hub's own registry, because ghcr deletes a pr-N image when the PR
          # moves on and PR 47 is now naming-only.
          images:
            console:
              tag: pr-88
              digest: sha256:0f143e159a43048edb6805a3c7747715e6704c947384cb34abc0362f98b9d50b
            backend:
              repository: image-registry.openshift-image-registry.svc:5000/ai-grid-provider-console/ai-grid-provider-backend
              tag: carry-routing-83b2cdd
              digest: sha256:562ee8327463400e7145a2dd1c2bf17b7961a61d677430e3810b747b62a96cc4
            authProxy:
              tag: ""
              digest: sha256:1a5f6e220362aa2077026bb7e3091c38f80aac861fa060b08045e58e783d5bc5
          console:
            # The Monitoring page: its tabs are the dashboard-* PersesDashboards in
            # one project, here OpenShift AI's, served by the Cluster Observability
            # Operator's Perses on the hub. demo1's hub runs no OpenShift AI, so the
            # project has no dashboards here; ai-grid-1's does.
            perses:
              url: https://perses.openshift-cluster-observability-operator.svc:8080
              project: redhat-ods-monitoring
          backend:
            # Add to AI Grid and Remove patch ManagedCluster labels. The chart's
            # ValidatingAdmissionPolicy limits the backend to the ai-grid/* and
            # location labels and the ai-grid/* annotations.
            clusterWrites: true
            # The catalog repository. The token that pushes to it is Secret
            # ai-grid-backend-git, never in git; keep it scoped to this
            # repository alone.
            git:
              url: '@catalogRepoURL@'
              branch: main
              # Where the backend writes models. The catalog's delivery, its
              # AppProject and its status Policy all assume this namespace,
              # which rhoai-prerequisites' Policy creates.
              modelsNamespace: ai-grid-internal-models
    # What the chart doesn't hold: ACM Search access for the backend.
    - repoURL: '@templateRepoURL@'
      targetRevision: HEAD
      path: apps/console/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-grid-provider-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
