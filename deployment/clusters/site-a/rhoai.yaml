# site-a (ingress): the MaaS gateway's https listener names the host's Let's
# Encrypt certificate (sites/site-a/maas-route/certificate.yaml). Helm replaces
# lists, so both of the template's listeners are repeated, which drops the
# profile's tls block; this adds the certificate back. The Route passes TLS
# through to it, so the AI gateway controller's consumer portal (which attaches
# to the https listener only) serves /maas-portal.
# No hostname here: cluster-gitops' gateway-hostname policy sets both listeners'
# hostname (maas.<apps domain>), and the rhoai ApplicationSet ignores it. If
# these values also set a hostname, Argo CD's RespectIgnoreDifferences keeps
# the live listener list on every sync, so no listener change from git applies
# (it did on 2026-11-05: the tls block had to be added by hand).
components:
  aigateway:
    modelsAsAService:
      gateway:
        spec:
          listeners:
            - name: http
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
            - name: https
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - group: ""
                    kind: Secret
                    name: maas-gw-public-tls
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
# Identity test images (2026-11-05), for testing the flat OIDC claims before a
# 3.6 build: maas-api and maas-controller from MaaS PR 1834 head e89282d (merge
# of main 7f536e7), with no commits of ours (1834 qualifies groups by org_id,
# which our old X11 fix did); the MaaS BFF from odh-dashboard main 05d5fc7 +
# PR 10540 ba7d88c, on the 3.6 nightly's odh-mod-arch-maas image (FBC 4d6d0dd).
# Public on ghcr.io/ai-grid-cloud; notes in the ai-grid workspace
# docs/status/2026-11-05-identity-test-images.md. This list replaces the
# template's env list, which is empty. Remove once a nightly carries 1834 and
# 10540.
# core-bff is the payload's (2026-11-05): after odh-dashboard #10541 the portal
# frontend calls no core-bff /api route, so the stock user_token core-bff works.
operator:
  rhoai:
    olm:
      config:
        env:
          - name: RELATED_IMAGE_ODH_MAAS_API_IMAGE
            value: ghcr.io/ai-grid-cloud/maas-api@sha256:9cabfdeadc7a9ed16a1e135c7e4de692e82dce3770a937d0dd7269efa336f0d9
          - name: RELATED_IMAGE_ODH_MAAS_CONTROLLER_IMAGE
            value: ghcr.io/ai-grid-cloud/maas-controller@sha256:95b04a5466dfc8dea52eccfb647ed28278caf59192bed641e06e438d680e978a
          - name: RELATED_IMAGE_ODH_MOD_ARCH_MAAS_IMAGE
            value: ghcr.io/ai-grid-cloud/maas-ui@sha256:d8399c717d2442353fd6d84671f5d9c4ab2a4b76039049e825f58bb0837c1963
