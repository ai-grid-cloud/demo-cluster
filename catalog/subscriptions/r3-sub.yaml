apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
    maas.opendatahub.io/retain-api-keys-on-delete: "true"
    openshift.io/display-name: r3-sub
  name: r3-sub
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-cpu
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 10000
      window: 1h
  organization:
    id: f5729719-5a09-4af9-9e4c-6b4e9c9af6db
  owner:
    groups:
    - name: f5729719-5a09-4af9-9e4c-6b4e9c9af6db/ai-grid-users
    users: []
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  annotations:
    openshift.io/display-name: r3-sub
  labels:
    ai-grid/subscription: r3-sub
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: r3-sub-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-cpu
    namespace: models-as-a-service
  subjects:
    groups:
    - name: f5729719-5a09-4af9-9e4c-6b4e9c9af6db/ai-grid-users
    users: []
