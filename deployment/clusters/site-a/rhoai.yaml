# site-a (ingress): MaaS's public hostname. maas-api refuses to work until the
# MaaS gateway's listeners name an external hostname ("Gateway has no external
# hostname configured"), and the template leaves it unset. Helm replaces
# lists, so both of the template's listeners are repeated with the hostname
# added. The router terminates TLS for this host (sites/site-a/maas-route).
components:
  aigateway:
    modelsAsAService:
      gateway:
        spec:
          listeners:
            - name: http
              port: 80
              hostname: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
            - name: https
              port: 443
              hostname: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
# SSO group test (ai-grid-research, 2026-11-03): MaaS PR 1812 (maas-api,
# maas-controller at be6dbb5) and odh-dashboard PR 10540 (the MaaS BFF at
# ba7d88c, on the running maas-ui image), built in site-a's own registry
# (namespace sso-test-images). This list replaces the template's env list, so
# its other entries are repeated from apps/rhoai/values.yaml. The 1812 maas-api
# replaces Kevin Howell's loki-access-proxy test build. Remove after the test.
