# The tenants' OIDC issuer and client, which the template's tenant Policy
# writes into site-a's AITenant. maas-cli is the public client the CLI and the
# portal's sign-in proxy share (MaaS matches the token's azp against it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhoai-keycloak-public-url
  namespace: redhat-ai-grid
data:
  realm: ai-grid
  clientId: maas-cli
  audience: maas-cli
  # PLACEHOLDER, as in keycloak/kustomization.yaml.
  publicUrl: https://keycloak.apps.hub.example.invalid
