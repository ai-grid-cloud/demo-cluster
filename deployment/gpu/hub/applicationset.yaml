# The NodeFeatureDiscovery and ClusterPolicy CRs, and the ai-grid-gpu preset, on
# each inference and combined spoke (Placement ai-grid-inference). The NFD and
# NVIDIA GPU operators themselves come from cluster-gitops's rhoai app, whose
# ai-grid-inference and ai-grid-combined profiles install them (#195).
# apps/gpu.yaml fills in the clusters generator's values (the deployment
# repository), which the template reads as .values.*.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gpu
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-inference
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
  template:
    metadata:
      name: 'gpu-{{ .name | trunc 37 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        # The NodeFeatureDiscovery and ClusterPolicy, once their CRDs exist.
        - repoURL: '{{ .values.deploymentRepoURL }}'
          targetRevision: '{{ .values.deploymentRevision }}'
          path: '{{ .values.deploymentPath }}/gpu/crs'
      # The hub through Argo CD's in-cluster server, as in the template's rhoai Applications.
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
      syncPolicy:
        automated:
          # Off while the operators' Namespaces, OperatorGroups and Subscriptions
          # move to the rhoai app, so this app never deletes them.
          prune: false
          selfHeal: true
        retry:
          refresh: true
          limit: -1
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
