apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-b
    ai-grid/version: "1"
    opendatahub.io/hardware-profile-name: nvidia-gpu
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    openshift.io/display-name: Qwen2.5-0.5B-Instruct
  labels:
    ai-grid/model: qwen25-05b-instruct
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: qwen25-05b-instruct
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-single-node-template-nvidia-cuda
  model:
    name: qwen25-05b-instruct
    uri: hf://Qwen/Qwen2.5-0.5B-Instruct
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler:
      template:
        containers:
        - args:
          - --metrics-cert-dir=/var/run/kserve/tls
          name: main
  template:
    containers:
    - name: main
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: qwen25-05b-instruct
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: qwen25-05b-instruct-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qwen25-05b-instruct
  policyTypes:
  - Ingress
