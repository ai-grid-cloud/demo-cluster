apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: maas-consumer-deploy
  name: maas-consumer-auth-proxy-ingress
  namespace: openshift-ingress
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kuadrant-system
          podSelector:
            matchLabels:
              authorino-resource: authorino
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - port: 4180
          protocol: TCP
  podSelector:
    matchLabels:
      app: maas-consumer-auth-proxy
  policyTypes:
    - Ingress
