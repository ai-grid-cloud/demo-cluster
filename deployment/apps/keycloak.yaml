apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: openshift-gitops
spec:
  project: default
  # This deployment's overlay of apps/keycloak: realms and hostnames.
  source:
    repoURL: '@deploymentRepoURL@'
    targetRevision: '@deploymentRevision@'
    path: '@deploymentPath@/keycloak'
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
