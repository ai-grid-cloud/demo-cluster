apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-b
    ai-grid/version: "1"
    openshift.io/display-name: SmolLM2-360M-Instruct
  labels:
    ai-grid/model: smollm2-360m-instruct
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: smollm2-360m-instruct
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-single-node-template-nvidia-cuda
  model:
    name: smollm2-360m-instruct
    uri: hf://HuggingFaceTB/SmolLM2-360M-Instruct
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler:
      template:
        containers:
        - args:
          - --metrics-cert-dir=/var/run/kserve/tls
          name: main
  template:
    containers:
    - name: main
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "1"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: smollm2-360m-instruct
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: smollm2-360m-instruct-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smollm2-360m-instruct
  policyTypes:
  - Ingress
