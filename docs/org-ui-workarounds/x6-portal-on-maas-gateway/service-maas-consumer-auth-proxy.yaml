apiVersion: v1
kind: Service
metadata:
  labels:
    app: maas-consumer-auth-proxy
    app.kubernetes.io/part-of: maas-consumer-deploy
  name: maas-consumer-auth-proxy
  namespace: openshift-ingress
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 4180
      protocol: TCP
      targetPort: 4180
    - name: metrics
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    app: maas-consumer-auth-proxy
  sessionAffinity: None
  type: ClusterIP
