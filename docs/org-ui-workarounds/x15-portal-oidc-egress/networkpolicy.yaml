apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: sso-run4-hacks
  name: maas-portal-oidc-egress
  namespace: redhat-ods-applications
spec:
  egress:
    - ports:
        - port: 443
          protocol: TCP
  podSelector:
    matchLabels:
      deployment: maas-portal
  policyTypes:
    - Egress
