# The provider console on demo1, with the git writer: models and subscriptions are
# commits to demo-cluster's catalog/ (CATALOG_REPO_URL). Secrets
# ai-grid-provider-console-oauth, ai-grid-backend-keycloak and
# ai-grid-backend-git come from bootstrap, never git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: console
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/console
    kustomize:
      # Until backend PR 29 (git mode) and console PR 63 merge: the builds in
      # demo1's internal registry (env integration/demo1 9eaa864: backend PR 29
      # a0b2196, build ai-grid-backend-local-8; console PR 63 539835d).
      images:
        - ghcr.io/ai-grid-cloud/ai-grid-provider-console=image-registry.openshift-image-registry.svc:5000/ai-grid/ai-grid-provider-console@sha256:74d184b3f417c512672687cc8ccec7064fbc5c9fee09ba6fec47f58952ba9e8e
        - ghcr.io/ai-grid-cloud/ai-grid-provider-backend=image-registry.openshift-image-registry.svc:5000/ai-grid/ai-grid-backend@sha256:cd62be27779fd7020caa63409ce01cc3d4db6b99c90d5157f8978ba94c4bf30a
      patches:
        - target: { kind: Deployment, name: ai-grid-provider-console }
          patch: |
            - { op: test, path: /spec/template/spec/containers/2/name, value: ai-grid-backend }
            - { op: add, path: /spec/template/spec/containers/2/env/-, value: { name: AI_GRID_GIT_URL, value: '@catalogRepoURL@' } }
            - { op: add, path: /spec/template/spec/containers/2/env/-, value: { name: AI_GRID_GIT_BRANCH, value: main } }
            - { op: add, path: /spec/template/spec/containers/2/env/-, value: { name: AI_GRID_GIT_TOKEN_FILE, value: /var/run/secrets/ai-grid-git/token } }
            # The namespaces (AI_GRID_MODELS_NAMESPACE, the BFF's MODELS_NAMESPACE)
            # come from the template's apps/console.
            - op: add
              path: /spec/template/spec/containers/2/volumeMounts
              value: [{ name: ai-grid-git, mountPath: /var/run/secrets/ai-grid-git, readOnly: true }]
            - op: add
              path: /spec/template/spec/volumes/-
              value: { name: ai-grid-git, secret: { secretName: ai-grid-backend-git, optional: true, defaultMode: 0440, items: [{ key: token, path: token }] } }
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-grid
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      refresh: true
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
