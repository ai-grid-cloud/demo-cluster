# Models and subscriptions the provider console writes to the catalog
# repository (CATALOG_REPO_URL: demo-cluster), and their status read back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-grid-catalog
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/ai-grid-catalog
    helm:
      releaseName: ai-grid-catalog
      parameters:
        - name: catalogRepoURL
          value: '@catalogRepoURL@'
        - name: catalogRevision
          value: '@catalogRevision@'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - SkipDryRunOnMissingResource=true
