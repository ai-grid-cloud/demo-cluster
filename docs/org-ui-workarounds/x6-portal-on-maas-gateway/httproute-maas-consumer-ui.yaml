apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/part-of: maas-consumer-deploy
  name: maas-consumer-ui
  namespace: openshift-ingress
spec:
  hostnames:
    - maas.apps.ocp.bclkw.sandbox2619.opentlc.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-default-gateway
      namespace: openshift-ingress
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            path:
              replaceFullPath: /maas-portal/
              type: ReplaceFullPath
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /maas-portal
    - backendRefs:
        - group: ""
          kind: Service
          name: maas-portal
          namespace: redhat-ods-applications
          port: 8443
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /
              type: ReplacePrefixMatch
        - requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-username
              - x-maas-group
              - x-maas-orgid
              - x-maas-roles
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
          type: RequestHeaderModifier
        - responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /maas-portal
