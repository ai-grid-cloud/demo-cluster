# The MaaS Portal sign-in proxy's cookie secret (clusters/site-a/maas-portal/,
# temporary), generated on each ingress spoke once and kept: the lookup returns
# the existing Secret, so the value never changes and never leaves the spoke or
# enters git. The proxy's client is public, so no client secret exists.
# Bound to the template's rhoai-tenant-clusters Placement (ingress and combined
# spokes). Only site-a runs the proxy today; elsewhere the Secret is unused.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: maas-portal-proxy-secret
  namespace: redhat-ai-grid
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: maas-portal-proxy-secret
        spec:
          severity: medium
          pruneObjectBehavior: DeleteIfCreated
          object-templates-raw: |
            {{- $s := lookup "v1" "Secret" "redhat-ods-applications" "maas-consumer-auth-proxy-creds" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-consumer-auth-proxy-creds
                  namespace: redhat-ods-applications
                  labels:
                    app.kubernetes.io/part-of: maas-consumer-deploy
                type: Opaque
                data:
                  OAUTH2_PROXY_COOKIE_SECRET: '{{ if $s }}{{ index $s.data "OAUTH2_PROXY_COOKIE_SECRET" }}{{ else }}{{ randAlphaNum 32 | base64enc }}{{ end }}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: maas-portal-proxy-secret
  namespace: redhat-ai-grid
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-tenant-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: maas-portal-proxy-secret
