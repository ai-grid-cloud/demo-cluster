# Vendored from lphiri/maas-portal-integration-poc deploy/maas-portal/15-auth-proxy-networkpolicy.yaml
# at f163e02 (MIT License, Copyright (c) 2026 lphiri;
# third-party/maas-portal-integration-poc.LICENSE), rendered with kustomize for
# site-a's MaaS gateway, realm ai-grid and client maas-cli (parameters.env in
# README.md in this directory).
# TEMPORARY: remove this directory once a nightly that mounts the MaaS Portal on
# the MaaS gateway itself (ai-gateway-controller PR 190, ODH-ADR-MS-0008)
# reaches site-a, or the two will collide on /maas-portal and /oauth2.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: maas-consumer-deploy
  name: maas-consumer-auth-proxy-ingress
  namespace: redhat-ods-applications
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kuadrant-system
      podSelector:
        matchLabels:
          authorino-resource: authorino
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-ingress
      podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: maas-default-gateway
    ports:
    - port: 4180
      protocol: TCP
  podSelector:
    matchLabels:
      app: maas-consumer-auth-proxy
  policyTypes:
  - Ingress
