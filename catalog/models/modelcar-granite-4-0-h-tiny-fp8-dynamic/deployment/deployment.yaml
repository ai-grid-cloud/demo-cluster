apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-b
    ai-grid/version: "1"
    openshift.io/display-name: modelcar-granite-4-0-h-tiny-fp8-dynamic
  labels:
    ai-grid/model: modelcar-granite-4-0-h-tiny-fp8-dynamic
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: modelcar-granite-4-0-h-tiny-fp8-dynamic
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    name: modelcar-granite-4-0-h-tiny-fp8-dynamic
    uri: oci://registry.redhat.io/rhai/modelcar-granite-4-0-h-tiny-fp8-dynamic:3.0
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler:
      template:
        containers:
        - args:
          - --metrics-cert-dir=/var/run/kserve/tls
          name: main
  template:
    containers:
    - image: oci://registry.redhat.io/rhai/modelcar-granite-4-0-h-tiny-fp8-dynamic:3.0
      name: main
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: modelcar-granite-4-0-h-tiny-fp8-dynamic
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: modelcar-granite-4-0-h-tiny-fp8-dynamic-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: modelcar-granite-4-0-h-tiny-fp8-dynamic
  policyTypes:
  - Ingress
