# Tenants reach MaaS on site-a at https://maas.<site-a apps domain>. The router
# passes TLS through to the MaaS gateway's https listener, which serves the
# host's Let's Encrypt certificate (certificate.yaml, clusters/site-a/rhoai.yaml).
# The AI gateway controller's consumer portal attaches to that listener only,
# so /maas-portal and /oauth2 are served by it.
# Site-specific: the host is site-a's apps domain.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway-route
  namespace: openshift-ingress
spec:
  host: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
  to:
    kind: Service
    name: maas-default-gateway-maas-gateway-class
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
