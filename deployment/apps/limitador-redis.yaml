# Limitador's Redis on each ingress spoke (site-a), password-protected, for
# that spoke's own Limitador: the template's apps/limitador-redis/ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: limitador-redis
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@templateRepoURL@'
    targetRevision: HEAD
    path: apps/limitador-redis/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
