# site-b declared to site-a's grid by hand, as the reference template declares
# its peer (deployment/clusters/local-cluster/manifests/declared-peer-ai-grid-2.yaml):
# a provider learns a peer's models only through gossip, which doesn't run
# between these clusters. One InferenceProvider per model site-b serves; a model
# the console places on site-b isn't routed from site-a until it's listed here.
apiVersion: grid.praxis.fast/v1alpha1
kind: GridSite
metadata:
  name: site-b
  labels:
    grid.hexfusion.io/declared-peer: "true"
    # The provider console's InferenceProviders for models on site-b select
    # their site by this label (catalog/models/<id>/catalog/grid.yaml).
    ai-grid/site: site-b
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  gridNetworkRef: grid
---
# clusterName matches the backend site-a's consumer gateway declares for site-b
# (clusters/site-a/rhoai.yaml).
apiVersion: grid.praxis.fast/v1alpha1
kind: InferenceProvider
metadata:
  name: peer-site-b-granite-4-tiny
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  gridNetworkRef: grid
  providerKind: vllm
  backendKind: local_model
  clusterName: peer-site-b
  endpoint: https://site-b.apps.ocp.865h4.sandbox5343.opentlc.com:443/v1
  siteSelector:
    matchLabels:
      grid.hexfusion.io/declared-peer: "true"
  models:
    - name: granite-4-tiny
      capabilities:
        - text_generation
