apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-b
    ai-grid/version: "1"
    openshift.io/display-name: UAT serving options CPU
  labels:
    ai-grid/model: uat-so-cpu
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: uat-so-cpu
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    name: uat-so-cpu
    uri: hf://HuggingFaceTB/SmolLM2-135M-Instruct
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
    - name: main
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: uat-so-cpu
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: uat-so-cpu-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uat-so-cpu
  policyTypes:
  - Ingress
