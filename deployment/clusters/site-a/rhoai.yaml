# site-a is the ingress spoke (ai-grid/role=ingress): no model is placed on it,
# so its grid consumer has one backend, site-b through site-b's provider
# gateway. Add a local backend here if site-a becomes combined and runs a model.
praxis-gateway:
  praxisConfig:
    render:
      backends:
        # Any name under site-b's router wildcard reaches the router; the SNI,
        # which the chart defaults to site-b.grid.internal, picks the provider
        # gateway's passthrough Route.
        - cluster: peer-site-b
          site: site-b
          endpoints:
            - site-b.apps.ocp.865h4.sandbox5343.opentlc.com:443
          transport:
            mode: mutual_tls
