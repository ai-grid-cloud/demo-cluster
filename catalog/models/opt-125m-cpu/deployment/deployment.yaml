apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: site-a,site-b
    ai-grid/version: "1"
  labels:
    ai-grid/model: opt-125m-cpu
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: opt-125m-cpu
  namespace: ai-grid-internal-models
spec:
  baseRefs:
  - name: v3-6-0-kserve-config-llm-template-cpu
  model:
    name: opt-125m-cpu
    uri: hf://facebook/opt-125m
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
    - env:
      - name: VLLM_CPU_KVCACHE_SPACE
        value: "1"
      - name: VLLM_ADDITIONAL_ARGS
        value: --chat-template '{% for m in messages %}{{`{{`}} m.content {{`}}`}}
          {% endfor %}'
      name: main
      resources:
        limits:
          cpu: "2"
          memory: 10Gi
        requests:
          cpu: "1"
          memory: 8Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: opt-125m-cpu
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: opt-125m-cpu-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opt-125m-cpu
  policyTypes:
  - Ingress
