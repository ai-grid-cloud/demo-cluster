# site-a (ingress): MaaS's public hostname. maas-api refuses to work until the
# MaaS gateway's listeners name an external hostname ("Gateway has no external
# hostname configured"), and the template leaves it unset. Helm replaces
# lists, so both of the template's listeners are repeated with the hostname
# added. The router terminates TLS for this host (sites/site-a/maas-route).
components:
  aigateway:
    modelsAsAService:
      gateway:
        spec:
          listeners:
            - name: http
              port: 80
              hostname: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
            - name: https
              port: 443
              hostname: maas.apps.ocp.bclkw.sandbox2619.opentlc.com
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
# SSO Run 4 (ai-grid-research, 2026-11-04), our fixes off: maas-api and
# maas-controller from MaaS main 0ed0143 (#1816) + PR 1812 0818e91; the MaaS BFF
# and core-bff from odh-dashboard main 76982ad (#10541) + PR 10540 ba7d88c, on
# the nightly's frontend images. Built in site-a's own registry
# (namespace sso-test-images). This list replaces the template's env list, so
# its other entries are repeated from apps/rhoai/values.yaml (cluster-gitops main
# after #203: only the AI gateway controller; the Grid operator and model
# controller come from the payload). The 1812 maas-api
# replaces Kevin Howell's loki-access-proxy test build. Remove after the test.
operator:
  rhoai:
    olm:
      config:
        env:
          - name: RELATED_IMAGE_ODH_AI_GATEWAY_CONTROLLER_IMAGE
            value: quay.io/sbatsche/odh-ai-gateway-controller@sha256:3968ba3bf7037ae2eba0c6b9239c4b72ba50ef193fed987caf89649e49467015
          - name: RELATED_IMAGE_ODH_MAAS_API_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/maas-api@sha256:3f582b63ba136cbf8ffcbbf54b90c01ce0f0732fb37c3ffca9732aad29d2ef44
          - name: RELATED_IMAGE_ODH_MAAS_CONTROLLER_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/maas-controller@sha256:8527f2ad5e9efa01fda4ddbf35bdb2e39b70dac74bc12547c7a7c833e0575126
          - name: RELATED_IMAGE_ODH_MOD_ARCH_MAAS_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/maas-ui@sha256:fdf10f0ce2cd7b85e9a232e3c33d5d43ec36c9735b10848481d415f672a802e7
          # SSO Run 4 (fixes off): core-bff with upstream auth (no gateway mode), from odh-dashboard main + #10540.
          - name: RELATED_IMAGE_ODH_CORE_BFF_IMAGE
            value: image-registry.openshift-image-registry.svc:5000/sso-test-images/core-bff@sha256:9d8f1a70519883f46bde80351aeebc1419570d6b1a4295c870726aaa21267bd9
