apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
    openshift.io/display-name: r2-sub
  name: r2-sub
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-cpu
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 10000
      window: 1h
  organization:
    id: 822d97b4-7582-42a8-bf0c-8f54837db861
  owner:
    groups:
    - name: 822d97b4-7582-42a8-bf0c-8f54837db861/ai-grid-users
    users: []
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  annotations:
    openshift.io/display-name: r2-sub
  labels:
    ai-grid/subscription: r2-sub
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: r2-sub-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-cpu
    namespace: models-as-a-service
  subjects:
    groups:
    - name: 822d97b4-7582-42a8-bf0c-8f54837db861/ai-grid-users
    users: []
